# LLM evidence capture, with direct New API fallback.
upstream llm_evidence_ingress {
    server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3000 backup max_fails=0;
}
server {
    listen 80;

    server_name ai.lu-k.cn;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/ai.lu-k.cn;
    include /www/server/panel/vhost/nginx/extension/ai.lu-k.cn/*.conf;
    
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/ai.lu-k.cn.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END
    #REDIRECT START
    
    #REDIRECT END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    
    include enable-php-00.conf;
    #PHP-INFO-END

    #IP-RESTRICT-START 限制访问ip的配置，IP黑白名单
    
    #IP-RESTRICT-END

    #BASICAUTH START
    
    #BASICAUTH END

    #SUB_FILTER START
    
    #SUB_FILTER END

    #GZIP START
    
    #GZIP END

    #GLOBAL-CACHE START
    
    #GLOBAL-CACHE END

    #WEBSOCKET-SUPPORT START
    proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    #WEBSOCKET-SUPPORT END

    #PROXY-CONF-START
    location ^~ / {
      return 301 https://$host$request_uri;
      
      
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Real-Port $remote_port;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header REMOTE-HOST $remote_addr;
      
      proxy_connect_timeout 60s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      
      
      
      
      
    }
    #PROXY-CONF-END

    #SERVER-BLOCK START
    
    #SERVER-BLOCK END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }
    
    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location /.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    #LOG START
    
access_log  /www/wwwlogs/ai.lu-k.cn.log;
    error_log  /www/wwwlogs/ai.lu-k.cn.error.log;
    
    #LOG END
}
# ===== 443 + CC Proxy admin + SEO (restored by DSH) =====
server {
    listen 443 ssl;
    http2 on;
    server_name ai.lu-k.cn;

    ssl_certificate     /www/server/panel/vhost/cert/ai.lu-k.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ai.lu-k.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    access_log /www/wwwlogs/ai.lu-k.cn.log;
    error_log  /www/wwwlogs/ai.lu-k.cn.error.log;
    client_max_body_size 100m;

    location = /proxy { return 301 /proxy/; }

    location ^~ /proxy/ {
        auth_basic "CC Proxy Admin";
        auth_basic_user_file /www/server/nginx/conf/cc_admin.htpasswd;
        proxy_pass http://127.0.0.1:3050/;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /admin/api/ {
        auth_basic "CC Proxy Admin";
        auth_basic_user_file /www/server/nginx/conf/cc_admin.htpasswd;
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- SEO: real robots.txt / sitemap.xml (crawlers must not receive the SPA shell) ----
    location = /robots.txt {
        alias /www/wwwroot/luk-brand/robots.txt;
        types { }
        default_type text/plain;
        charset utf-8;
        expires 1h;
    }
    location = /sitemap.xml {
        alias /www/wwwroot/luk-brand/sitemap.xml;
        types { }
        default_type application/xml;
        charset utf-8;
        expires 1h;
    }
    location = /seo.css {
        alias /www/wwwroot/luk-brand/seo.css;
        types { }
        default_type text/css;
        charset utf-8;
        expires 7d;
    }
    location = /luk-seo.js {
        alias /www/wwwroot/luk-brand/luk-seo.js;
        types { }
        default_type application/javascript;
        charset utf-8;
        expires 1h;
    }

    # ---- IndexNow key file (Bing / Yandex / Naver instant indexing) ----
    location = /9f2c7ab41d6e4f8b93c05d7e6a18b234.txt {
        root /www/wwwroot/luk-brand/verify-root;
        types { }
        default_type text/plain;
        charset utf-8;
        expires 1h;
    }

    # ---- search console verification files (drop files into this dir, they are served at /) ----
    # google*.html / baidu_verify*.html / sogou / 360 / BingSiteAuth.xml and any root-level
    # *verif* / *siteauth* .html|.xml|.txt file are served from verify-root, never from the SPA.
    location ~* "^/(google[0-9a-f]+\.html|baidu_verify_[^/]+\.html|baiduverify[^/]*\.html|sogou_site_verification[^/]*\.html|360_ssite_verify[^/]*\.html|[a-z0-9_-]*(verif|siteauth)[a-z0-9_.-]*\.(html|xml|txt))$" {
        root /www/wwwroot/luk-brand/verify-root;
        try_files $uri =404;
    }

    # ---- brand assets served locally (override newapi logo/favicon) ----
    location = /logo.png {
        alias /www/wwwroot/luk-brand/icon.png;
        types { }
        default_type image/png;
        expires -1;
    }
    location = /favicon.ico {
        alias /www/wwwroot/luk-brand/icon.png;
        types { }
        default_type image/png;
        expires -1;
    }

