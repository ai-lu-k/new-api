services:
  # 服务名必须和生产的 `new-api` 不同。两个环境共用下面那张网络，而 compose 会把
  # 服务名注册成网络别名：同名的话 `new-api` 同时解析到两个容器，按这个名字
  # 找网关的入口（http://new-api:3000）就把线上 /v1/ 的流量分一部分给测试环境，
  # 用测试库鉴权和计费。2026-09-29 到 10-02 就是这么跑的，release.sh 会检查这一点。
  new-api-staging:
    # 测试环境：同一个镜像、同一个 MySQL 实例，但独立 schema、独立密钥、独立端口。
    # 只绑 127.0.0.1，经 SSH 隧道访问，不对外暴露。
    image: luk/new-api:${NEWAPI_TAG:-tavern}
    container_name: new-api-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - SQL_DSN=${SQL_DSN}
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}
      # 隧道访问的是 http://127.0.0.1:3001，Secure cookie 不会被浏览器发回，
      # 开着的话登录会直接坏掉。也正因为关了它，SESSION_COOKIE_TRUSTED_URL
      # 不能再设：new-api 认为这两个设置互斥，会拒绝启动。
      - SESSION_COOKIE_SECURE=false
      - CRITICAL_RATE_LIMIT=300
      - CRITICAL_RATE_LIMIT_DURATION=1200
    networks:
      - new-api-net

# 复用生产已有的网络，使 `mysql` 这个主机名解析到现有的 MySQL 容器，
# 从而不必为测试环境再起一个数据库实例。
networks:
  new-api-net:
    name: new-api_new-api-net
    external: true
